<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="grid-line-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <!-- Matrix Cube Gradients -->
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: #ffffff; letter-spacing: -1px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #cbd5e1; }
    .mono-accent { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 14px; fill: #38bdf8; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Matrix Coordinate Background Pattern -->
  <g stroke="url(#grid-line-glow)" stroke-width="1" fill="none">
    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="320" y1="0" x2="320" y2="320" />
    <line x1="440" y1="0" x2="440" y2="320" />
    <line x1="560" y1="0" x2="560" y2="320" />
    <line x1="680" y1="0" x2="680" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="920" y1="0" x2="920" y2="320" />
    <line x1="1040" y1="0" x2="1040" y2="320" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="8" height="320" rx="4" fill="url(#accent-cyan-blue)" />

  <!-- Content Left Section -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Super-title -->
    <rect x="0" y="44" width="280" height="32" rx="16" fill="url(#pill-grad)" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="60" r="5" fill="#38bdf8" filter="url(#glow)" />
    <text x="32" y="65" class="mono-accent">KEITH GALLI CHALLENGE SERIES</text>

    <!-- Main Title -->
    <text x="0" y="130" class="title">
      NUMPY <tspan fill="url(#accent-cyan-blue)">100 MASTERY</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">
      100 Exercises Solved with Modern Best Practices, Deep Intuition &amp; Benchmarks
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 212)">
      <!-- Badge 1: 100 Exercises -->
      <g>
        <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <circle cx="20" cy="19" r="4" fill="#38bdf8" />
        <text x="36" y="24" class="badge-text">100 / 100 Solved</text>
      </g>

      <!-- Badge 2: NumPy 2.x Ready -->
      <g transform="translate(185, 0)">
        <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2" />
        <circle cx="20" cy="19" r="4" fill="#60a5fa" />
        <text x="36" y="24" class="badge-text">NumPy 2.x Ready</text>
      </g>

      <!-- Badge 3: 7 Modular Chapters -->
      <g transform="translate(370, 0)">
        <rect width="185" height="38" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
        <circle cx="20" cy="19" r="4" fill="#a855f7" />
        <text x="36" y="24" class="badge-text">7 Topic Notebooks</text>
      </g>

      <!-- Badge 4: Test Verified -->
      <g transform="translate(570, 0)">
        <rect width="150" height="38" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
        <circle cx="20" cy="19" r="4" fill="#10b981" />
        <text x="36" y="24" class="badge-text">Pytest Verified</text>
      </g>
    </g>
  </g>

  <!-- Right Section: 3D Isometric NumPy Matrix Illustration -->
  <g transform="translate(980, 160)">
    <!-- Central Glowing Core -->
    <circle cx="0" cy="0" r="110" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
    <circle cx="0" cy="0" r="70" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

    <!-- Isometric Matrix Voxel Array (3x3 grid) -->
    <!-- Row -1 -->
    <g transform="translate(-60, -35)">
      <polygon points="0,-18 30,-35 60,-18 30,0" fill="url(#cube-top)" opacity="0.95" />
      <polygon points="0,-18 30,0 30,35 0,18" fill="url(#cube-left)" opacity="0.95" />
      <polygon points="30,0 60,-18 60,18 30,35" fill="url(#cube-right)" opacity="0.95" />
    </g>
    <g transform="translate(0, -70)">
      <polygon points="0,-18 30,-35 60,-18 30,0" fill="url(#cube-top)" opacity="0.85" />
      <polygon points="0,-18 30,0 30,35 0,18" fill="url(#cube-left)" opacity="0.85" />
      <polygon points="30,0 60,-18 60,18 30,35" fill="url(#cube-right)" opacity="0.85" />
    </g>
    <g transform="translate(60, -35)">
      <polygon points="0,-18 30,-35 60,-18 30,0" fill="url(#cube-top)" opacity="0.9" />
      <polygon points="0,-18 30,0 30,35 0,18" fill="url(#cube-left)" opacity="0.9" />
      <polygon points="30,0 60,-18 60,18 30,35" fill="url(#cube-right)" opacity="0.9" />
    </g>

    <!-- Row 0 -->
    <g transform="translate(-60, 20)">
      <polygon points="0,-18 30,-35 60,-18 30,0" fill="url(#cube-top)" />
      <polygon points="0,-18 30,0 30,35 0,18" fill="url(#cube-left)" />
      <polygon points="30,0 60,-18 60,18 30,35" fill="url(#cube-right)" />
    </g>
    <g transform="translate(0, -15)">
      <polygon points="0,-18 30,-35 60,-18 30,0" fill="#38bdf8" filter="url(#glow)" opacity="0.9" />
      <polygon points="0,-18 30,0 30,35 0,18" fill="#0284c7" />
      <polygon points="30,0 60,-18 60,18 30,35" fill="#38bdf8" />
    </g>
    <g transform="translate(60, 20)">
      <polygon points="0,-18 30,-35 60,-18 30,0" fill="url(#cube-top)" />
      <polygon points="0,-18 30,0 30,35 0,18" fill="url(#cube-left)" />
      <polygon points="30,0 60,-18 60,18 30,35" fill="url(#cube-right)" />
    </g>

    <!-- Row 1 -->
    <g transform="translate(0, 55)">
      <polygon points="0,-18 30,-35 60,-18 30,0" fill="url(#cube-top)" />
      <polygon points="0,-18 30,0 30,35 0,18" fill="url(#cube-left)" />
      <polygon points="30,0 60,-18 60,18 30,35" fill="url(#cube-right)" />
    </g>
  </g>
</svg>
